

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{background:#111;color:#fff;font-family:system-ui;padding:20px}input{width:100%;padding:12px;margin:6px 0;background:#222;border:1px solid #444;color:#fff;border-radius:6px}button{padding:12px;background:#4f7cff;color:#fff;border:0;border-radius:6px;width:100%;font-weight:700}</style>
</head><body>
<h2>Admin - Direct Post (GitHub Pages)</h2>
<input id="img" placeholder="Image link https://...">
<input id="name" placeholder="Name">
<input id="code" placeholder="Code">
<input id="price" placeholder="Price">
<input id="desc" placeholder="Desc">
<button id="btn" onclick="post()">POST NOW</button>
<p id="s"></p>
<script>
const BIN="https://api.npoint.io/6161fabf116efcde0e19";
let data=[];
async function load(){let r=await fetch(BIN+"?t="+Date.now(),{cache:"no-store"});data=await r.json();s.innerText=data.length+" loaded - old bin works";}
load();
async function post(){
 btn.innerText="Posting...";
 let o={img:img.value,name:name.value,code:code.value,price:price.value,desc:desc.value};
 data.unshift(o);
 try{
  let res=await fetch(BIN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  s.innerText="✅ SUCCESS "+res.status+" - Refresh main site, no hard reload needed!";
  btn.innerText="POST NOW";
 }catch(e){s.innerText="❌ "+e; btn.innerText="POST NOW";}
}
</script>
</body></html>
